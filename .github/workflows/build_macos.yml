name: Build HomeGrid Backup for macOS (Intel x86_64)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'main.py'
      - 'core/**'
      - 'console/**'
      - 'gui/**'
      - 'icon.ico'
      - 'icon.png'
      - '.github/workflows/build_macos.yml'

permissions:
  contents: write

jobs:
  build-mac-intel:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (Intel x86_64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install build dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install nuitka pillow pystray keyring send2trash

      - name: Convert icon.ico to macOS icon.icns (if exists)
        run: |
          if [ -f "icon.ico" ]; then
            python3 -c "from PIL import Image; Image.open('icon.ico').save('icon.icns')" || true
          fi

      - name: Build macOS Intel .app bundle with Nuitka
        run: |
          ICON_ARG=""
          if [ -f "icon.icns" ]; then
            ICON_ARG="--macos-app-icon=icon.icns"
          fi
          python3 -m nuitka \
            --standalone \
            --lto=yes \
            --jobs=4 \
            --python-flag=no_site \
            --python-flag=no_asserts \
            --python-flag=no_docstrings \
            --noinclude-pytest-mode=nofollow \
            --noinclude-setuptools-mode=nofollow \
            --noinclude-unittest-mode=nofollow \
            --assume-yes-for-downloads \
            --macos-create-app-bundle \
            --macos-target-arch=x86_64 \
            --enable-plugin=tk-inter \
            $ICON_ARG \
            --include-data-files=icon.ico=icon.ico \
            --include-package=core \
            --include-package=console \
            --include-package=gui \
            --include-package=pystray \
            --include-package=PIL \
            --include-package=keyring \
            --include-package=send2trash \
            --nofollow-import-to=mobile,kivy,unittest,pydoc,test,lib2to3,ensurepip,distutils,setuptools,pip,curses,sqlite3,xmlrpc,ftplib,imaplib,poplib,smtplib,telnetlib,turtle,turtledemo,tkinter.test,PIL.ImageQt,PIL.ImageTk,PIL.SpiderImagePlugin \
            --output-dir=dist_mac \
            --output-filename=HomeGridBackup \
            main.py

      - name: Sign and package HomeGridBackup.app into single .7z archive
        run: |
          mkdir -p dist_mac/pack
          APP_BUNDLE=$(find dist_mac -maxdepth 1 -name "*.app" | head -n 1)
          mv "$APP_BUNDLE" dist_mac/pack/HomeGridBackup.app
          chmod -R u+rwX,go+rX dist_mac/pack/HomeGridBackup.app
          chmod +x dist_mac/pack/HomeGridBackup.app/Contents/MacOS/HomeGridBackup
          asset="rclone-v1.76.0-osx-amd64.zip"
          curl -fsSL "https://downloads.rclone.org/v1.76.0/$asset" -o "$asset"
          echo "4f5835733d52b818340f97b1fc0348a70461534d123363a183ca2b660219595a  $asset" | shasum -a 256 -c -
          mkdir -p rclone-macos
          unzip -q "$asset" -d rclone-macos
          rclone_path=$(find rclone-macos -type f -name rclone -print -quit)
          test -n "$rclone_path"
          cp "$rclone_path" dist_mac/pack/HomeGridBackup.app/Contents/MacOS/rclone
          chmod +x dist_mac/pack/HomeGridBackup.app/Contents/MacOS/rclone
          mkdir -p dist_mac/pack/HomeGridBackup.app/Contents/Resources
          curl -fsSL https://raw.githubusercontent.com/rclone/rclone/v1.76.0/COPYING \
            -o dist_mac/pack/HomeGridBackup.app/Contents/Resources/rclone-LICENSE.txt
          codesign --force --deep --sign - dist_mac/pack/HomeGridBackup.app
          cat <<'INSTALL_EOF' > "dist_mac/pack/Install HomeGridBackup.command"
          #!/bin/bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "$0")" && pwd)"
          APP_SOURCE="$SCRIPT_DIR/HomeGridBackup.app"
          if [ -w "/Applications" ]; then
            DEST="/Applications/HomeGridBackup.app"
          else
            mkdir -p "$HOME/Applications"
            DEST="$HOME/Applications/HomeGridBackup.app"
          fi
          rm -rf "$DEST"
          ditto "$APP_SOURCE" "$DEST"
          printf 'HomeGrid Backup installed to %s\n' "$DEST"
          INSTALL_EOF
          chmod +x "dist_mac/pack/Install HomeGridBackup.command"
          cd dist_mac/pack
          7z a -t7z -mx=9 ../HomeGridBackup_macOS_Intel.7z HomeGridBackup.app "Install HomeGridBackup.command"
          cd ../..

      - name: Create per-user macOS installation image
        run: |
          hdiutil create \
            -volname "HomeGridBackup" \
            -srcfolder dist_mac/pack \
            -ov \
            -format UDZO \
            dist_mac/HomeGridBackup_macOS_Intel.dmg

      - name: Set build completion timestamp
        id: build_time
        run: echo "value=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Strip raw .py sources before packaging
        run: find . -maxdepth 4 \( -path './dist*' -o -path './build*' -o -path './*.app*' \) -name '*.py' -delete || true

      - name: Delete old macOS Intel releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          for t in $(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -F 'macos-intel'); do
            gh release delete "$t" --yes --cleanup-tag || true
          done

      - name: Publish clean .7z to GitHub Releases (no double zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-intel-latest
          name: HomeGrid Backup 3.04 — macOS Intel (x86_64)
          body: |
            Архів **HomeGridBackup_macOS_Intel.7z** збережений. Також доданий пер-користувацький образ **HomeGridBackup_macOS_Intel.dmg**.
            В образі запустіть `Install HomeGridBackup.command`; програма встановиться в `/Applications/HomeGridBackup.app` (або `~/Applications/HomeGridBackup.app`, якщо немає прав запису в `/Applications`). Rclone 1.76.0 входить у комплект.
          files: |
            dist_mac/HomeGridBackup_macOS_Intel.7z
            dist_mac/HomeGridBackup_macOS_Intel.dmg
          fail_on_unmatched_files: true
          make_latest: true
