name: Build HomeGrid Backup for Android (APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - 'icon.png'
      - 'core/**'
      - 'mobile/**'
      - '.github/workflows/build_android.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev lld patch

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv setuptools wheel

      - name: Build Android APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeGridBackup-Android-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Set build completion timestamp
        id: build_time
        run: echo "value=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Delete previous Android release and tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release delete android-apk-latest --yes || true
          git push origin --delete android-apk-latest || true

      - name: Publish Android APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-latest
          name: HomeGrid Backup — Android APK — ${{ steps.build_time.outputs.value }}
          body: |
            Android APK built at ${{ steps.build_time.outputs.value }}.
          files: bin/*.apk
          fail_on_unmatched_files: true
