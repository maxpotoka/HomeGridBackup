name: Build HomeGrid Backup for Android (APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - 'core/**'
      - 'mobile/**'
      - '.github/workflows/build_android.yml'

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v1-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-v1-

      - name: Install system dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev libsqlite3-dev libbz2-dev liblzma-dev cmake libffi-dev libssl-dev lld patch

      - name: Install Buildozer, compatible setuptools and Cython
        run: |
          python -m pip install --upgrade "pip<24.3"
          pip install "setuptools<70.0.0" "wheel<0.44" "cython==0.29.36" buildozer virtualenv

      - name: Build Android APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeGridBackup-Android-APK
          path: bin/*.apk
