name: Build HomeGrid Backup for Windows 10/11 (OneFile x64)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'main.py'
      - 'core/**'
      - 'console/**'
      - 'gui/**'
      - '.github/workflows/build_windows10.yml'

jobs:
  build-win10-onefile:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up 64-bit Python 3.12 (Windows 10/11)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka zstandard pillow pystray keyring send2trash

      - name: Build max-optimized single-file Windows 10/11 binary with Nuitka
        shell: cmd
        run: |
          set "ICON_FLAG="
          if exist "icon.ico" set "ICON_FLAG=--windows-icon-from-ico=icon.ico"
          python -m nuitka ^
            --onefile ^
            --onefile-tempdir-spec="{CACHE_DIR}\HomeGridBackup" ^
            --lto=yes ^
            --msvc=latest ^
            --jobs=4 ^
            --python-flag=no_site ^
            --python-flag=no_asserts ^
            --python-flag=no_docstrings ^
            --noinclude-pytest-mode=nofollow ^
            --noinclude-setuptools-mode=nofollow ^
            --noinclude-unittest-mode=nofollow ^
            --noinclude-custom-mode=mobile:nofollow ^
            --noinclude-custom-mode=kivy:nofollow ^
            --assume-yes-for-downloads ^
            --windows-console-mode=attach ^
            --enable-plugin=tk-inter ^
            --company-name="HomeGrid" ^
            --product-name="HomeGrid Backup" ^
            --file-version="1.0.23.0" ^
            --product-version="1.0.23.0" ^
            --file-description="HomeGrid Backup Utility (Windows 10/11 x64)" ^
            %ICON_FLAG% ^
            --include-package=core ^
            --include-package=console ^
            --include-package=gui ^
            --include-package=pystray ^
            --include-module=pystray._win32 ^
            --include-package=PIL ^
            --include-package=keyring ^
            --include-module=keyring.backends.Windows ^
            --include-package=send2trash ^
            --nofollow-import-to=mobile,kivy,unittest,pydoc,test,lib2to3,ensurepip,distutils,setuptools,pip,curses,sqlite3,xmlrpc,ftplib,imaplib,poplib,smtplib,telnetlib,turtle,turtledemo,tkinter.test,PIL.ImageQt,PIL.ImageTk,PIL.SpiderImagePlugin ^
            --output-dir=dist_win10 ^
            --output-filename=HomeGridBackup_Win10_x64.exe ^
            main.py

      - name: Upload Windows 10/11 OneFile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeGridBackup-Windows10-x64-OneFile
          path: dist_win10/HomeGridBackup_Win10_x64.exe
