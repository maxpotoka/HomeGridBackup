name: Build HomeGrid Backup Windows 10/11 (folder + installer)

on:
  workflow_dispatch:

concurrency:
  group: build-win10-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-win10:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up 64-bit Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          pip install nuitka pillow pystray keyring send2trash
          python -c "import sys,struct; assert sys.version_info[:2]==(3,12) and struct.calcsize('P')*8==64"

      - name: Set build variant (Windows 10/11)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Content -Path core\build_variant.py -Value 'WINDOWS7_CLOUD_SYNC_PREVIEW = False' -Encoding ascii

      - name: Build folder with Nuitka
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nuitkaArgs = @(
            '--standalone', '--lto=yes', '--msvc=latest', '--jobs=4',
            '--python-flag=no_site', '--python-flag=no_asserts', '--python-flag=no_docstrings',
            '--enable-plugin=tk-inter', '--windows-console-mode=attach', '--assume-yes-for-downloads',
            '--company-name=HomeGrid', '--product-name=HomeGrid Backup',
            '--file-version=3.03.0.0', '--product-version=3.03.0.0',
            '--file-description=HomeGrid Backup Utility (Windows 10/11 x64)',
            '--include-data-files=icon.ico=icon.ico', '--windows-icon-from-ico=icon.ico',
            '--include-package=core', '--include-package=console', '--include-package=gui',
            '--include-package=pystray', '--include-module=pystray._win32',
            '--include-package=PIL', '--include-package=keyring',
            '--include-module=keyring.backends.Windows', '--include-package=send2trash',
            '--nofollow-import-to=mobile,kivy,unittest,pydoc,test,lib2to3,ensurepip,distutils,setuptools,pip,curses,sqlite3,xmlrpc,ftplib,imaplib,poplib,smtplib,telnetlib,turtle,turtledemo',
            '--output-dir=dist_win10', '--output-filename=HomeGridBackup.exe', 'main.py'
          )
          python -m nuitka @nuitkaArgs
          if ($LASTEXITCODE -ne 0) { throw "Nuitka failed: $LASTEXITCODE" }
          if (-not (Test-Path 'dist_win10\main.dist\HomeGridBackup.exe')) {
            throw 'HomeGridBackup.exe was not created'
          }

      - name: Prepare installer payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'packaging\installer_payload' | Out-Null
          robocopy 'dist_win10\main.dist' 'packaging\installer_payload' /MIR /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found: $iscc" }
          New-Item -ItemType Directory -Force -Path 'release' | Out-Null
          & $iscc '/DAppVersion=3.03' '/DOutputBaseFilename=HomeGridBackup_Win10_x64_Setup' '/Orelease' 'packaging\windows_user_setup.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          if (-not (Test-Path 'release\HomeGridBackup_Win10_x64_Setup.exe')) { throw 'Installer was not created' }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.03-win10-x64-${{ github.run_number }}
          name: HomeGrid Backup 3.03 (Windows 10/11 x64)
          files: release/HomeGridBackup_Win10_x64_Setup.exe
