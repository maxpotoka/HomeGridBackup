name: Build HomeGrid Backup for Windows 10/11 (OneFile x64)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-win10-onefile:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up 64-bit Python 3.12 (Windows 10/11)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka pillow pystray keyring send2trash

      - name: Build single-file Windows 10/11 binary with Nuitka (minimal compression)
        shell: cmd
        run: |
          set "ICON_FLAG="
          if exist "icon.ico" set "ICON_FLAG=--windows-icon-from-ico=icon.ico"
          python -m nuitka ^
            --onefile ^
            --onefile-no-compression ^
            --onefile-tempdir-spec="{CACHE_DIR}\HomeGridBackup" ^
            --lto=yes ^
            --msvc=latest ^
            --jobs=4 ^
            --python-flag=no_site ^
            --python-flag=no_asserts ^
            --python-flag=no_docstrings ^
            --noinclude-pytest-mode=nofollow ^
            --noinclude-setuptools-mode=nofollow ^
            --noinclude-unittest-mode=nofollow ^
            --assume-yes-for-downloads ^
            --windows-console-mode=attach ^
            --enable-plugin=tk-inter ^
            --company-name="HomeGrid" ^
            --product-name="HomeGrid Backup" ^
            --file-version="1.0.55.0" ^
            --product-version="1.0.55.0" ^
            --file-description="HomeGrid Backup Utility (Windows 10/11 x64)" ^
            %ICON_FLAG% ^
            --include-package=core ^
            --include-package=console ^
            --include-package=gui ^
            --include-package=pystray ^
            --include-module=pystray._win32 ^
            --include-package=PIL ^
            --include-package=keyring ^
            --include-module=keyring.backends.Windows ^
            --include-package=send2trash ^
            --nofollow-import-to=mobile,kivy,unittest,pydoc,test,lib2to3,ensurepip,distutils,setuptools,pip,curses,sqlite3,xmlrpc,ftplib,imaplib,poplib,smtplib,telnetlib,turtle,turtledemo,tkinter.test,PIL.ImageQt,PIL.ImageTk,PIL.SpiderImagePlugin ^
            --output-dir=dist_win10 ^
            --output-filename=HomeGridBackup_Win10_x64.exe ^
            main.py

      - name: Delete old Windows 10/11 release and tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          gh release delete windows10-x64-latest --yes 2>$null
          git push origin --delete windows10-x64-latest 2>$null

      - name: Publish clean .exe to GitHub Releases (no zip wrapper)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows10-x64-latest
          name: HomeGrid Backup — Windows 10 / 11 (OneFile x64)
          body: |
            Чистий виконуваний файл **HomeGridBackup_Win10_x64.exe** без обгортки `.zip`.
            Запускається напряму подвійним кліком без встановлення.
          files: dist_win10/HomeGridBackup_Win10_x64.exe
          make_latest: true
