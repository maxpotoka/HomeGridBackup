name: Build HomeGrid Backup for Ubuntu (Linux x86_64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'main.py'
      - 'core/**'
      - 'console/**'
      - 'gui/**'
      - '.github/workflows/build_ubuntu.yml'

permissions:
  contents: write

jobs:
  build-ubuntu-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld patchelf python3-tk p7zip-full \
            libayatana-appindicator3-dev \
            gir1.2-ayatanaappindicator3-0.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev \
            gir1.2-secret-1 libsecret-1-0

      - name: Set up Python 3.11 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "nuitka==4.3.5" ordered-set
          pip install "pystray==0.19.5" pillow keyring secretstorage jeepney send2trash "PyGObject==3.48.2" pycairo

      - name: Verify GI namespaces
        run: |
          python -c "import gi; gi.require_version('Secret', '1'); from gi.repository import Secret; print('Secret GI namespace OK')"
          python -c "import gi; gi.require_version('AyatanaAppIndicator3', '0.1'); from gi.repository import AyatanaAppIndicator3; print('AyatanaAppIndicator3 GI namespace OK')"

      - name: Patch pystray for AyatanaAppIndicator3
        run: |
          PYSTRAY_AI="$(python -c "import sysconfig; print(sysconfig.get_path('purelib'))")/pystray/_appindicator.py"
          sed -i "s/gi.require_version('AppIndicator3', '0.1')/raise ValueError('AyatanaOnly')/g" "$PYSTRAY_AI"
          sed -i "s/from gi.repository import AppIndicator3 as AppIndicator/pass/g" "$PYSTRAY_AI"
          grep -q "AyatanaOnly" "$PYSTRAY_AI" || { echo "ERROR: патч pystray не застосувався"; exit 1; }
          echo "pystray patch OK"

      - name: Build with Nuitka (onefile)
        env:
          CFLAGS: "-O3 -mtune=generic -pipe"
          CXXFLAGS: "-O3 -mtune=generic -pipe"
          LDFLAGS: "-Wl,-O1,--as-needed"
        run: |
          TYPELIB_DIR="/usr/lib/x86_64-linux-gnu/girepository-1.0"
          python -m nuitka \
            --onefile \
            --enable-plugin=tk-inter \
            --disable-plugin=gi \
            --clang \
            --lto=yes \
            --jobs=4 \
            --assume-yes-for-downloads \
            --python-flag=no_asserts \
            --python-flag=no_docstrings \
            --noinclude-pytest-mode=nofollow \
            --noinclude-setuptools-mode=nofollow \
            --noinclude-unittest-mode=nofollow \
            --include-package=core \
            --include-package=console \
            --include-package=gui \
            --include-module=gi._gi \
            --include-module=pystray \
            --include-module=pystray._appindicator \
            --include-module=pystray._xorg \
            --include-package=keyring \
            --include-package=secretstorage \
            --include-package=jeepney \
            --include-package=PIL \
            --include-package-data=keyring \
            --include-package-data=pystray \
            --include-package-data=PIL \
            --include-module=send2trash \
            --include-data-files="$TYPELIB_DIR/Secret-1.typelib=girepository-1.0/Secret-1.typelib" \
            --include-data-files="$TYPELIB_DIR/AyatanaAppIndicator3-0.1.typelib=girepository-1.0/AyatanaAppIndicator3-0.1.typelib" \
            --nofollow-import-to=gi.repository,mobile,kivy,unittest,pydoc,test,lib2to3,ensurepip,distutils,setuptools,pip,curses,sqlite3,xmlrpc,ftplib,imaplib,poplib,smtplib,telnetlib,turtle,turtledemo,tkinter.test \
            --output-dir=build \
            --output-filename=homegridBackup \
            main.py

      - name: Verify build output
        run: |
          test -f build/homegridBackup || { echo "ERROR: Nuitka не створив виконуваний файл build/homegridBackup"; exit 1; }
          mkdir -p dist
          mv build/homegridBackup dist/homegridBackup
          chmod +x dist/homegridBackup
          file dist/homegridBackup

      - name: Package application into single .7z
        run: |
          cd dist
          7z a -t7z -mx=9 ../HomeGridBackup-Ubuntu-x86_64.7z homegridBackup
          cd ..
          ls -lh HomeGridBackup-Ubuntu-x86_64.7z

      - name: Publish clean .7z to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ubuntu-x64-latest
          name: HomeGrid Backup — Ubuntu (Linux x86_64)
          body: |
            Одиничний виконуваний файл **homegridBackup** (onefile) для Linux x86_64.
            Розпакуйте архів і запустіть: `chmod +x homegridBackup && ./homegridBackup`
            Вимоги: Ubuntu 24.04 або новіша, для іконки в треї потрібен AppIndicator.
          files: HomeGridBackup-Ubuntu-x86_64.7z
          make_latest: false
