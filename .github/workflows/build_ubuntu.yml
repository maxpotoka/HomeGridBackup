name: Build HomeGrid Backup for Ubuntu (Linux x86_64)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'main.py'
      - 'core/**'
      - 'console/**'
      - 'gui/**'
      - '.github/workflows/build_ubuntu.yml'

permissions:
  contents: write

jobs:
  build-ubuntu-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld patchelf python3-tk p7zip-full \
            libayatana-appindicator3-dev gir1.2-ayatanaappindicator3-0.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install nuitka ordered-set pillow pystray keyring secretstorage jeepney send2trash "PyGObject<3.50" pycairo

      - name: Build Ubuntu 64-bit standalone folder with Nuitka (-O3 + LTO)
        env:
          CFLAGS: "-O3 -mtune=generic -pipe"
          CXXFLAGS: "-O3 -mtune=generic -pipe"
          LDFLAGS: "-Wl,-O1,--as-needed"
        run: |
          python3 -m nuitka \
            --standalone \
            --clang \
            --lto=yes \
            --jobs=4 \
            --python-flag=no_asserts \
            --python-flag=no_docstrings \
            --noinclude-pytest-mode=nofollow \
            --noinclude-setuptools-mode=nofollow \
            --noinclude-unittest-mode=nofollow \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --enable-plugin=gi \
            --include-package=core \
            --include-package=console \
            --include-package=gui \
            --include-package=gi \
            --include-package=pystray \
            --include-module=pystray._appindicator \
            --include-module=pystray._xorg \
            --include-package=PIL \
            --include-package=keyring \
            --include-package=secretstorage \
            --include-package=jeepney \
            --include-package=send2trash \
            --nofollow-import-to=mobile,kivy,unittest,pydoc,test,lib2to3,ensurepip,distutils,setuptools,pip,curses,sqlite3,xmlrpc,ftplib,imaplib,poplib,smtplib,telnetlib,turtle,turtledemo,tkinter.test,PIL.ImageQt,PIL.ImageTk,PIL.SpiderImagePlugin \
            --output-dir=dist_ubuntu \
            --output-filename=homegridBackup \
            main.py
          DIST_SRC=$(find dist_ubuntu -maxdepth 1 -type d -name "*.dist" | head -n 1)
          mv "$DIST_SRC" dist_ubuntu/homegridBackup
          chmod +x dist_ubuntu/homegridBackup/homegridBackup
          echo "=== Проверка файлов AppIndicator и typelib в сборке ==="
          find dist_ubuntu/homegridBackup -iname "*appindicator*" -o -iname "*.typelib"

      - name: Package folder into single .7z archive
        run: |
          cd dist_ubuntu
          7z a -t7z -mx=9 HomeGridBackup_Ubuntu_x64.7z homegridBackup

      - name: Publish clean .7z to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ubuntu-x64-latest
          name: HomeGrid Backup — Ubuntu (Linux x86_64)
          body: |
            Збірка у вигляді папки **homegridBackup/** для максимальної швидкодії (без розпакування при запуску).
            Після розпакування архіву запустіть: `cd homegridBackup && chmod +x homegridBackup && ./homegridBackup`
          files: dist_ubuntu/HomeGridBackup_Ubuntu_x64.7z
          make_latest: false
