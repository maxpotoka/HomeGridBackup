
name: Build Ubuntu

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld patchelf python3-tk p7zip-full \
            libayatana-appindicator3-dev \
            gir1.2-ayatanaappindicator3-0.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev \
            gir1.2-secret-1 libsecret-1-0 \
            gir1.2-appindicator3-0.1 libappindicator3-1

      - name: Verify Secret GI namespace
        run: |
          python3 -c "import gi; gi.require_version('Secret', '1'); from gi.repository import Secret; print('Secret GI namespace OK')"

      - name: Verify AppIndicator GI namespace
        run: |
          python3 -c "import gi; gi.require_version('AppIndicator3', '0.1'); from gi.repository import AppIndicator3; print('AppIndicator3 GI namespace OK')"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard
          pip install pystray pillow keyring send2trash

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --enable-plugin=gi \
            --enable-plugin=tk-inter \
            --clang \
            --lto=yes \
            --jobs=2 \
            --assume-yes-for-downloads \
            --python-flag=no_site \
            --include-package=core \
            --include-package=gui \
            --include-package=pystray \
            --include-module=pystray._appindicator \
            --include-module=keyring \
            --include-package=PIL \
            --include-package-data=keyring \
            --include-package-data=pystray \
            --include-package-data=PIL \
            --include-module=send2trash \
            --output-dir=build \
            --output-filename=HomeGridBackup \
            --follow-imports \
            --lto=yes \
            --python-flag=-O \
            main.py

      - name: Locate build output
        run: |
          find build -maxdepth 2 -type f -name "HomeGridBackup" -print
          find build -maxdepth 2 -type d -name "*.dist" -print

      - name: Package application
        run: |
          DIST_DIR=$(find build -maxdepth 1 -type d -name "*.dist" -print -quit)

          if [ -z "$DIST_DIR" ]; then
            echo "ERROR: Nuitka distribution directory not found"
            exit 1
          fi

          mv "$DIST_DIR" HomeGridBackup
          7z a HomeGridBackup-Ubuntu-x86_64.7z HomeGridBackup/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeGridBackup-Ubuntu-x86_64
          path: HomeGridBackup-Ubuntu-x86_64.7z
          if-no-files-found: error
