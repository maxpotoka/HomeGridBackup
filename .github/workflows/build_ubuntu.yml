name: Build HomeGrid Backup for Ubuntu (Linux x86_64)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
    paths:
      - 'main.py'
      - 'core/**'
      - 'console/**'
      - 'gui/**'
      - '.github/workflows/build_ubuntu.yml'

permissions:
  contents: write

jobs:
  build-ubuntu-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld patchelf python3-tk p7zip-full \
            libayatana-appindicator3-dev \
            gir1.2-ayatanaappindicator3-0.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev \
            gir1.2-secret-1 libsecret-1-0

      - name: Set up Python 3.11 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set
          pip install pystray pillow keyring secretstorage jeepney send2trash "PyGObject<3.50" pycairo

      - name: Verify Secret GI namespace
        run: |
          python -c "import gi; gi.require_version('Secret', '1'); from gi.repository import Secret; print('Secret GI namespace OK')"

      - name: Verify AppIndicator GI namespace
        run: |
          python -c "import gi; gi.require_version('AyatanaAppIndicator3', '0.1'); from gi.repository import AyatanaAppIndicator3; print('AyatanaAppIndicator3 GI namespace OK')"

      - name: Patch pystray for AyatanaAppIndicator3 and Build with Nuitka
        env:
          CFLAGS: "-O3 -mtune=generic -pipe"
          CXXFLAGS: "-O3 -mtune=generic -pipe"
          LDFLAGS: "-Wl,-O1,--as-needed"
        run: |
          PYSTRAY_AI=$(python -c "import pystray._appindicator as m; print(m.__file__)")
          sed -i "s/gi.require_version('AppIndicator3', '0.1')/raise ValueError('AyatanaOnly')/g" "$PYSTRAY_AI"
          sed -i "s/from gi.repository import AppIndicator3 as AppIndicator/pass/g" "$PYSTRAY_AI"

          python -m nuitka \
            --standalone \
            --enable-plugin=tk-inter \
            --clang \
            --lto=yes \
            --jobs=4 \
            --assume-yes-for-downloads \
            --python-flag=no_asserts \
            --python-flag=no_docstrings \
            --noinclude-pytest-mode=nofollow \
            --noinclude-setuptools-mode=nofollow \
            --noinclude-unittest-mode=nofollow \
            --include-package=core \
            --include-package=console \
            --include-package=gui \
            --include-package=gi \
            --include-package=pystray \
            --include-module=pystray._appindicator \
            --include-module=pystray._xorg \
            --include-package=keyring \
            --include-package=secretstorage \
            --include-package=jeepney \
            --include-package=PIL \
            --include-package-data=keyring \
            --include-package-data=pystray \
            --include-package-data=PIL \
            --include-module=send2trash \
            --nofollow-import-to=mobile,kivy,unittest,pydoc,test,lib2to3,ensurepip,distutils,setuptools,pip,curses,sqlite3,xmlrpc,ftplib,imaplib,poplib,smtplib,telnetlib,turtle,turtledemo,tkinter.test,PIL.ImageQt,PIL.ImageTk,PIL.SpiderImagePlugin \
            --output-dir=build \
            --output-filename=homegridBackup \
            main.py

      - name: Locate and verify build output
        run: |
          DIST_DIR=$(find build -maxdepth 1 -type d -name "*.dist" -print -quit)
          if [ -z "$DIST_DIR" ]; then
            echo "ERROR: Nuitka distribution directory not found"
            exit 1
          fi
          mv "$DIST_DIR" homegridBackup
          chmod +x homegridBackup/homegridBackup
          echo "=== Проверка файлов AppIndicator, Secret и typelib ==="
          find homegridBackup -iname "*appindicator*" -o -iname "*secret*" -o -iname "*.typelib"

      - name: Package application into single .7z
        run: |
          7z a -t7z -mx=9 HomeGridBackup-Ubuntu-x86_64.7z homegridBackup/

      - name: Publish clean .7z to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ubuntu-x64-latest
          name: HomeGrid Backup — Ubuntu (Linux x86_64)
          body: |
            Збірка у вигляді папки **homegridBackup/** для максимальної швидкодії (без розпакування при запуску).
            Після розпакування архіву запустіть: `cd homegridBackup && chmod +x homegridBackup && ./homegridBackup`
          files: HomeGridBackup-Ubuntu-x86_64.7z
          make_latest: false
