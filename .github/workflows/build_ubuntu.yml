name: Build HomeGrid Backup for Ubuntu (Linux x86_64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'main.py'
      - 'core/**'
      - 'console/**'
      - 'gui/**'
      - 'icon.ico'
      - 'icon.png'
      - '.github/workflows/build_ubuntu.yml'

permissions:
  contents: write

jobs:
  build-ubuntu-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld patchelf python3-tk p7zip-full \
            libayatana-appindicator3-dev \
            gir1.2-ayatanaappindicator3-0.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev \
            gir1.2-secret-1 libsecret-1-0

      - name: Set up Python 3.11 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "nuitka==4.3.5" ordered-set
          pip install "pystray==0.19.5" python-xlib pillow keyring secretstorage jeepney send2trash "PyGObject==3.48.2" pycairo

      - name: Verify GI namespaces
        run: |
          python -c "import gi; gi.require_version('Secret', '1'); from gi.repository import Secret; print('Secret GI namespace OK')"
          python -c "import gi; gi.require_version('AyatanaAppIndicator3', '0.1'); from gi.repository import AyatanaAppIndicator3; print('AyatanaAppIndicator3 GI namespace OK')"
          python -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk; print('GTK tray backend OK')"
          python -c "import Xlib.display; print('XEmbed X11 backend OK')"

      - name: Patch pystray for AyatanaAppIndicator3
        run: |
          PYSTRAY_AI="$(python -c "import sysconfig; print(sysconfig.get_path('purelib'))")/pystray/_appindicator.py"
          sed -i "s/gi.require_version('AppIndicator3', '0.1')/raise ValueError('AyatanaOnly')/g" "$PYSTRAY_AI"
          sed -i "s/from gi.repository import AppIndicator3 as AppIndicator/pass/g" "$PYSTRAY_AI"
          grep -q "AyatanaOnly" "$PYSTRAY_AI" || { echo "ERROR: патч pystray не застосувався"; exit 1; }
          echo "pystray patch OK"

      - name: Build with Nuitka (standalone folder)
        env:
          CFLAGS: "-O3 -mtune=generic -pipe"
          CXXFLAGS: "-O3 -mtune=generic -pipe"
          LDFLAGS: "-Wl,-O1,--as-needed"
        run: |
          TYPELIB_DIR="/usr/lib/x86_64-linux-gnu/girepository-1.0"
          python -m nuitka \
            --standalone \
            --enable-plugin=tk-inter \
            --disable-plugin=gi \
            --clang \
            --lto=yes \
            --jobs=4 \
            --assume-yes-for-downloads \
            --python-flag=no_asserts \
            --python-flag=no_docstrings \
            --noinclude-pytest-mode=nofollow \
            --noinclude-setuptools-mode=nofollow \
            --noinclude-unittest-mode=nofollow \
            --include-package=core \
            --include-package=console \
            --include-package=gui \
            --include-module=gi._gi \
            --include-module=pystray \
            --include-module=pystray._appindicator \
            --include-module=pystray._gtk \
            --include-module=pystray._xorg \
            --include-package=Xlib \
            --include-package=keyring \
            --include-package=secretstorage \
            --include-package=jeepney \
            --include-package=PIL \
            --include-package-data=keyring \
            --include-package-data=pystray \
            --include-package-data=PIL \
            --include-module=send2trash \
            --include-data-files=icon.ico=icon.ico \
            --include-data-files="$TYPELIB_DIR/Secret-1.typelib=girepository-1.0/Secret-1.typelib" \
            --include-data-files="$TYPELIB_DIR/AyatanaAppIndicator3-0.1.typelib=girepository-1.0/AyatanaAppIndicator3-0.1.typelib" \
            --nofollow-import-to=gi.repository,mobile,kivy,unittest,pydoc,test,lib2to3,ensurepip,distutils,setuptools,pip,curses,sqlite3,xmlrpc,ftplib,imaplib,poplib,smtplib,telnetlib,turtle,turtledemo,tkinter.test \
            --output-dir=build \
            --output-filename=homegrid-backup \
            main.py

      - name: Assemble per-user install package
        run: |
          app_dist="$(find build -mindepth 1 -maxdepth 1 -type d -name '*.dist' -print -quit)"
          test -n "$app_dist" || { echo "ERROR: Nuitka standalone folder not found"; exit 1; }
          test -f "$app_dist/homegrid-backup" || { echo "ERROR: standalone executable not found"; exit 1; }
          mkdir -p dist
          mkdir -p dist/HomeGridBackup
          cp -a "$app_dist/." dist/HomeGridBackup/
          mv dist/HomeGridBackup/homegrid-backup dist/HomeGridBackup/HomeGridBackup
          chmod +x dist/HomeGridBackup/HomeGridBackup
          cp icon.png dist/HomeGridBackup/homegrid-backup.png
          cp icon.ico dist/HomeGridBackup/icon.ico
          file dist/HomeGridBackup/HomeGridBackup

          cat << 'INSTALL_EOF' > dist/install.sh
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          APP_SOURCE="$SCRIPT_DIR/HomeGridBackup"
          DEST="$HOME/.local/opt/HomeGridBackup"
          mkdir -p "$DEST"
          cp -a "$APP_SOURCE/." "$DEST/"
          chmod +x "$DEST/HomeGridBackup" "$DEST/rclone"
          mkdir -p "$HOME/.local/share/applications"
          DESKTOP_FILE="$HOME/.local/share/applications/homegrid-backup.desktop"
          cat > "$DESKTOP_FILE" << EOD
          [Desktop Entry]
          Type=Application
          Name=HomeGrid Backup
          Comment=Inverter Data Backup Utility
          TryExec="$DEST/HomeGridBackup"
          Exec="$DEST/HomeGridBackup" --gui
          Icon="$DEST/homegrid-backup.png"
          Terminal=false
          Categories=Utility;Archiving;
          EOD
          chmod 644 "$DESKTOP_FILE"
          printf 'HomeGrid Backup installed to %s\n' "$DEST"
          INSTALL_EOF
          chmod +x dist/install.sh

      - name: Bundle verified rclone for Linux x86_64
        run: |
          asset="rclone-v1.76.0-linux-amd64.zip"
          curl -fsSL "https://downloads.rclone.org/v1.76.0/$asset" -o "$asset"
          echo "b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7  $asset" | sha256sum -c -
          7z x "$asset" -orclone-linux >/dev/null
          rclone_path="$(find rclone-linux -type f -name rclone -print -quit)"
          test -n "$rclone_path"
          cp "$rclone_path" dist/HomeGridBackup/rclone
          chmod +x dist/HomeGridBackup/rclone
          curl -fsSL https://raw.githubusercontent.com/rclone/rclone/v1.76.0/COPYING -o dist/HomeGridBackup/rclone-LICENSE.txt
          bash -n dist/install.sh

      - name: Package standalone folder into .7z
        run: |
          cd dist
          7z a -t7z -mx=9 ../homegrid-backup-ubuntu-x86_64.7z HomeGridBackup install.sh
          cd ..
          ls -lh homegrid-backup-ubuntu-x86_64.7z

      - name: Set build completion timestamp
        id: build_time
        run: echo "value=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Delete old releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ubuntu-x64-latest --yes || true
          git push origin --delete ubuntu-x64-latest || true

      - name: Publish clean .7z to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ubuntu-x64-latest
          name: HomeGrid Backup — Ubuntu (Linux x86_64) — ${{ steps.build_time.outputs.value }}
          body: |
            Комплект містить standalone-папку **HomeGridBackup** з rclone 1.76.0 — запуск без розпакування onefile у тимчасовий каталог.
            - Розпакуйте архів і запустіть `./install.sh`; програма встановиться для поточного користувача в `~/.local/opt/HomeGridBackup`.
            - Установщик створить ярлик у меню програм. Права адміністратора не потрібні.
            Вимоги: Ubuntu 24.04 або новіша.
            Трей підтримується через StatusNotifier/AppIndicator та XEmbed у X11-панелях. У XFCE можна додати плагін Status Notifier або область сповіщень; у KDE Plasma увімкнути віджет «Системний лоток». Сумісні панелі також є в Cinnamon, MATE, Budgie і LXQt.
          files: homegrid-backup-ubuntu-x86_64.7z
          fail_on_unmatched_files: true
          make_latest: true
