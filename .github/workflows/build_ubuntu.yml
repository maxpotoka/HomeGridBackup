name: Build HomeGrid Backup for Ubuntu (Linux x86_64)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'main.py'
      - 'core/**'
      - 'console/**'
      - 'gui/**'
      - '.github/workflows/build_ubuntu.yml'

permissions:
  contents: write

jobs:
  build-ubuntu-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc patchelf python3-tk p7zip-full libayatana-appindicator3-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install nuitka ordered-set zstandard pillow pystray keyring send2trash

      - name: Build Ubuntu 64-bit executable with Nuitka
        run: |
          python3 -m nuitka \
            --standalone \
            --onefile \
            --lto=yes \
            --jobs=4 \
            --python-flag=no_site \
            --python-flag=no_asserts \
            --python-flag=no_docstrings \
            --noinclude-pytest-mode=nofollow \
            --noinclude-setuptools-mode=nofollow \
            --noinclude-unittest-mode=nofollow \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --include-package=core \
            --include-package=console \
            --include-package=gui \
            --include-package=pystray \
            --include-package=PIL \
            --include-package=keyring \
            --include-package=send2trash \
            --nofollow-import-to=mobile,kivy,unittest,pydoc,test,lib2to3,ensurepip,distutils,setuptools,pip,curses,sqlite3,xmlrpc,ftplib,imaplib,poplib,smtplib,telnetlib,turtle,turtledemo,tkinter.test,PIL.ImageQt,PIL.ImageTk,PIL.SpiderImagePlugin \
            --output-dir=dist_ubuntu \
            --output-filename=HomeGridBackup \
            main.py
          chmod +x dist_ubuntu/HomeGridBackup

      - name: Package into single .7z archive
        run: |
          cd dist_ubuntu
          7z a -t7z -mx=9 HomeGridBackup_Ubuntu_x64.7z HomeGridBackup

      - name: Publish clean .7z to GitHub Releases (no double zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ubuntu-x64-latest
          name: HomeGrid Backup — Ubuntu (Linux x86_64)
          body: |
            Чистий архів **HomeGridBackup_Ubuntu_x64.7z** без подвійного пакування у `.zip`.
            Після розпакування запустіть у терміналі: `chmod +x HomeGridBackup && ./HomeGridBackup`
          files: dist_ubuntu/HomeGridBackup_Ubuntu_x64.7z
          make_latest: false
