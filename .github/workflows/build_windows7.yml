name: Build HomeGrid Backup Windows 7 (folder + installer)

on:
  workflow_dispatch:

concurrency:
  group: build-win7-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-win7:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up 32-bit Python 3.8 (Windows 7 compatible)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: "x86"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          pip install "nuitka<2.6" "pillow<11.0" pystray keyring send2trash
          python -c "import sys,struct; assert sys.version_info[:2]==(3,8) and struct.calcsize('P')*8==32"

      - name: Set build variant (Windows 7 cloud sync preview)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Content -Path core\build_variant.py -Value 'WINDOWS7_CLOUD_SYNC_PREVIEW = True' -Encoding ascii

      - name: Build folder with Nuitka (MinGW64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nuitkaArgs = @(
            '--standalone', '--lto=yes', '--mingw64', '--jobs=4',
            '--python-flag=no_site', '--python-flag=no_asserts', '--python-flag=no_docstrings',
            '--enable-plugin=tk-inter', '--windows-console-mode=attach', '--assume-yes-for-downloads',
            '--company-name=HomeGrid', '--product-name=HomeGrid Backup',
            '--file-version=2.99.0.0', '--product-version=2.99.0.0',
            '--file-description=HomeGrid Backup Utility (Windows 7 x86)',
            '--include-data-files=icon.ico=icon.ico', '--windows-icon-from-ico=icon.ico',
            '--include-package=core', '--include-package=console', '--include-package=gui',
            '--include-package=pystray', '--include-module=pystray._win32',
            '--include-package=PIL', '--include-package=keyring',
            '--include-module=keyring.backends.Windows', '--include-package=send2trash',
            '--nofollow-import-to=mobile,kivy,unittest,pydoc,test,lib2to3,ensurepip,distutils,setuptools,pip,curses,sqlite3,xmlrpc,ftplib,imaplib,poplib,smtplib,telnetlib,turtle,turtledemo',
            '--output-dir=dist_win7', '--output-filename=HomeGridBackup.exe', 'main.py'
          )
          python -m nuitka @nuitkaArgs
          if ($LASTEXITCODE -ne 0) { throw "Nuitka failed: $LASTEXITCODE" }
          if (-not (Test-Path 'dist_win7\main.dist\HomeGridBackup.exe')) {
            throw 'HomeGridBackup.exe was not created'
          }

      - name: Prepare installer payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'packaging\installer_payload' | Out-Null
          robocopy 'dist_win7\main.dist' 'packaging\installer_payload' /MIR /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress
          & $iscc '/DAppVersion=2.99' '/DOutputBaseFilename=HomeGridBackup_Win7_x86_Setup' '/DAppDirName=HomeGridBackup_x86' '/DX86=1' '/Orelease' 'packaging\windows_user_setup.iss'
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found: $iscc" }
          New-Item -ItemType Directory -Force -Path 'release' | Out-Null
          & $iscc '/DAppVersion=2.99' '/DOutputBaseFilename=HomeGridBackup_Win7_x86_Setup' '/DAppDirName=HomeGridBackup_x86' '/DAppIdGuid={{6F1B2C3D-4E5F-4A6B-8C7D-9E0F1A2B3C4D}' '/Orelease' 'packaging\windows_user_setup.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          if (-not (Test-Path 'release\HomeGridBackup_Win7_x86_Setup.exe')) { throw 'Installer was not created' }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.99-win7-x86-${{ github.run_number }}
          name: HomeGrid Backup 2.99 (Windows 7 x86)
          files: release/HomeGridBackup_Win7_x86_Setup.exe
