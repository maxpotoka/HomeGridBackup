name: Build HomeGrid Backup for Windows 7 (Folder x86)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-win7-folder:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up 32-bit Python 3.8 (Windows 7 compatible)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: "x86"

      - name: Install pinned Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "nuitka<2.6" "pillow<11.0" pystray keyring send2trash

      - name: Enable Windows 7 cloud sync preview
        shell: pwsh
        run: |
          Set-Content -Path core\build_variant.py -Value "WINDOWS7_CLOUD_SYNC_PREVIEW = True" -Encoding ascii

      - name: Build max-optimized Windows 7 standalone folder with Nuitka
        shell: cmd
        run: |
          set "ICON_FLAG="
          if exist "icon.ico" set "ICON_FLAG=--windows-icon-from-ico=icon.ico"
          python -m nuitka ^
            --standalone ^
            --lto=yes ^
            --mingw64 ^
            --jobs=4 ^
            --python-flag=no_site ^
            --python-flag=no_asserts ^
            --python-flag=no_docstrings ^
            --noinclude-pytest-mode=nofollow ^
            --noinclude-setuptools-mode=nofollow ^
            --noinclude-unittest-mode=nofollow ^
            --assume-yes-for-downloads ^
            --windows-console-mode=attach ^
            --enable-plugin=tk-inter ^
            --company-name="HomeGrid" ^
            --product-name="HomeGrid Backup" ^
            --include-data-files=icon.ico=icon.ico ^
            --file-version="1.0.55.0" ^
            --product-version="1.0.55.0" ^
            --file-description="HomeGrid Backup Utility (Windows 7 x86)" ^
            %ICON_FLAG% ^
            --include-package=core ^
            --include-package=console ^
            --include-package=gui ^
            --include-package=pystray ^
            --include-module=pystray._win32 ^
            --include-package=PIL ^
            --include-package=keyring ^
            --include-module=keyring.backends.Windows ^
            --include-package=send2trash ^
            --nofollow-import-to=mobile,kivy,unittest,pydoc,test,lib2to3,ensurepip,distutils,setuptools,pip,curses,sqlite3,xmlrpc,ftplib,imaplib,poplib,smtplib,telnetlib,turtle,turtledemo,tkinter.test,PIL.ImageQt,PIL.ImageTk,PIL.SpiderImagePlugin ^
            --output-dir=dist_win7 ^
            --output-filename=HomeGridBackup.exe ^
            main.py

      - name: Bundle Windows 7-compatible rclone
        shell: pwsh
        run: |
          $version = "1.62.2"
          $archiveName = "rclone-v$version-windows-386.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $extractPath = Join-Path $env:RUNNER_TEMP "rclone-win7"
          $downloadUrl = "https://downloads.rclone.org/v$version/$archiveName"
          $expectedSha256 = "5b91ee887762007cd9fef64003a70c496f855602d1bbb1c32a364008611f98ff"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
          $actualSha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "rclone archive checksum mismatch: $actualSha256"
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force
          $rcloneSource = Get-ChildItem -LiteralPath $extractPath -Filter "rclone.exe" -Recurse |
            Select-Object -First 1
          if (-not $rcloneSource) {
            throw "rclone.exe was not found in the official archive."
          }

          $appDir = "dist_win7\main.dist"
          Copy-Item -LiteralPath $rcloneSource.FullName -Destination (Join-Path $appDir "rclone.exe")
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/rclone/rclone/v$version/COPYING" `
            -OutFile (Join-Path $appDir "rclone-COPYING.txt")

          & (Join-Path $appDir "rclone.exe") version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled rclone failed to start."
          }

      - name: Prepare batch scripts and ultra-compress archive
        shell: cmd
        run: |
          ren "dist_win7\main.dist" "HomeGridBackup"
          (
            echo @echo off
            echo chcp 65001 ^>nul
            echo "%%~dp0HomeGridBackup.exe" --silent
          ) > "dist_win7\HomeGridBackup\backup_silent.bat"
          (
            echo @echo off
            echo start "" "%%~dp0HomeGridBackup.exe" --hidden
          ) > "dist_win7\HomeGridBackup\backup_hidden.bat"
          cd /d "dist_win7"
          7z a -t7z -mx=9 -mfb=273 -md=64m "HomeGridBackup_Win7_x86.7z" "HomeGridBackup"

      - name: Build per-user Windows 7 installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force -Path "packaging\installer_payload" | Out-Null
          Copy-Item -Path "dist_win7\HomeGridBackup\*" -Destination "packaging\installer_payload" -Recurse -Force
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler /DAppVersion=2.25 /DOutputBaseFilename=HomeGridBackup_Win7_x86_Setup packaging\windows_user_setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed: $LASTEXITCODE" }

      - name: Set build completion timestamp
        id: build_time
        shell: pwsh
        run: |
          $utcNow = [DateTime]::UtcNow
          $buildTime = $utcNow.ToString("yyyy-MM-dd HH:mm:ss 'UTC'")
          $buildDate = $utcNow.ToString("yyyy.MM.dd")
          echo "value=$buildTime" >> $env:GITHUB_OUTPUT
          echo "date=$buildDate" >> $env:GITHUB_OUTPUT

      - name: Generate version tag
        id: tag
        shell: pwsh
        run: |
          $date = "${{ steps.build_time.outputs.date }}"
          $runNumber = "${{ github.run_number }}"
          $tag = "win7-x86-v$date.$runNumber"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Delete old Windows 7 releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $releasesJson = gh release list --json tagName 2>$null
          if ([string]::IsNullOrWhiteSpace($releasesJson)) {
            Write-Host "No releases found, skipping cleanup."
            exit 0
          }
          $releases = $releasesJson | ConvertFrom-Json
          if ($null -eq $releases -or $releases.Count -eq 0) {
            Write-Host "Release list is empty, skipping cleanup."
            exit 0
          }
          foreach ($release in $releases) {
            if ($release.tagName -match "^win7-x86-v\d{4}\.\d{2}\.\d{2}") {
              Write-Host "Deleting old release: $($release.tagName)"
              gh release delete $release.tagName --yes 2>$null
              $tagExists = git ls-remote --tags origin $release.tagName 2>$null
              if (-not [string]::IsNullOrWhiteSpace($tagExists)) {
                git push origin --delete $release.tagName 2>$null
                Write-Host "Deleted remote tag: $($release.tagName)"
              } else {
                Write-Host "Remote tag already deleted: $($release.tagName)"
              }
            }
          }
          Write-Host "Cleanup completed successfully."

      - name: Publish clean .7z to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: HomeGrid Backup — Windows 7/10/11 (x86 Folder) — ${{ steps.build_time.outputs.value }}
          body: |
            ## HomeGrid Backup для Windows 7 (x86)
            
            **Версія:** ${{ steps.tag.outputs.tag }}  
            **Дата збірки:** ${{ steps.build_time.outputs.value }}
            
            Установщик **HomeGridBackup_Win7_x86_Setup.exe** устанавливает приложение для текущего пользователя в `%LOCALAPPDATA%\Programs\HomeGridBackup` и добавляет ярлык в меню «Пуск». Права администратора не нужны.
            Архив **HomeGridBackup_Win7_x86.7z** сохранён для портативной установки: внутри папка `HomeGridBackup` с `HomeGridBackup.exe` и rclone 1.62.2 (32-bit).
            Настройка облаков находится в разделе «Настройки» приложения.
            
            ### Режимы запуска:
            - `HomeGridBackup.exe` - звичайний запуск
            - `backup_silent.bat` - тихий режим
            - `backup_hidden.bat` - прихований режим
            
            ### Системні вимоги:
            - Windows 7/8/10/11 (32-bit або 64-bit)
            - .NET Framework не потрібен
          files: |
            dist_win7/HomeGridBackup_Win7_x86.7z
            packaging/installer_output/HomeGridBackup_Win7_x86_Setup.exe
          fail_on_unmatched_files: true
          make_latest: false
