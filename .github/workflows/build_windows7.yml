@echo off
setlocal
cd /d "%~dp0"

echo [0/4] Checking Python 3.8 x86...
python -c "import sys,struct; assert sys.version_info[:2]==(3,8) and struct.calcsize('P')*8==32" 2>nul
if errorlevel 1 (
  echo ERROR: Python 3.8 32-bit is required.
  goto :fail
)

echo [1/4] Enabling Windows 7 build flag...
python -c "open('core/build_variant.py','w',encoding='ascii').write('WINDOWS7_CLOUD_SYNC_PREVIEW = True\n')"
if errorlevel 1 goto :fail

echo [2/4] Cleaning old output...
if exist dist_win7 rmdir /s /q dist_win7

echo [3/4] Building with Nuitka...
python -m nuitka ^
  --standalone ^
  --lto=yes ^
  --mingw64 ^
  --jobs=4 ^
  --python-flag=no_site ^
  --python-flag=no_asserts ^
  --python-flag=no_docstrings ^
  --enable-plugin=tk-inter ^
  --windows-console-mode=attach ^
  --assume-yes-for-downloads ^
  --company-name=HomeGrid ^
  --product-name="HomeGrid Backup" ^
  --file-version=2.76.0.0 ^
  --product-version=2.76.0.0 ^
  --include-data-files=icon.ico=icon.ico ^
  --windows-icon-from-ico=icon.ico ^
  --include-package=core ^
  --include-package=console ^
  --include-package=gui ^
  --include-package=pystray ^
  --include-module=pystray._win32 ^
  --include-package=PIL ^
  --include-package=keyring ^
  --include-module=keyring.backends.Windows ^
  --include-package=send2trash ^
  --nofollow-import-to=mobile,kivy,unittest,pydoc,test,lib2to3,ensurepip,distutils,setuptools,pip,curses,sqlite3,xmlrpc,ftplib,imaplib,poplib,smtplib,telnetlib,turtle,turtledemo ^
  --output-dir=dist_win7 ^
  --output-filename=HomeGridBackup.exe ^
  main.py
if errorlevel 1 goto :fail

echo [4/4] Verifying output...
if not exist "dist_win7\main.dist\HomeGridBackup.exe" (
  echo ERROR: HomeGridBackup.exe was not created.
  goto :fail
)

echo.
echo SUCCESS: dist_win7\main.dist\HomeGridBackup.exe
pause
exit /b 0

:fail
echo.
echo BUILD FAILED.
pause
exit /b 1
