name: Build HomeGrid Backup for Windows 7 (Folder x86)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

env:
  APP_VERSION: "2.76"
  APP_FILE_VERSION: "2.76.0.0"

jobs:
  build-win7-folder:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up 32-bit Python 3.8 (Windows 7 compatible)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: "x86"

      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          pip install "nuitka<2.6" "pillow<11.0" pystray keyring send2trash
          if ($LASTEXITCODE -ne 0) { throw 'dependency install failed' }
          python -c "import sys; assert sys.version_info[:2] == (3, 8), sys.version"

      - name: Enable Windows 7 cloud sync preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Content -Path core\build_variant.py -Value 'WINDOWS7_CLOUD_SYNC_PREVIEW = True' -Encoding ascii
          $content = Get-Content core\build_variant.py -Raw
          if ($content -notmatch 'WINDOWS7_CLOUD_SYNC_PREVIEW = True') { throw 'build_variant.py was not updated' }

      - name: Build Windows 7 standalone folder with Nuitka
        shell: cmd
        run: |
          set "ICON_FLAG="
          if exist "icon.ico" set "ICON_FLAG=--windows-icon-from-ico=icon.ico"
          python -m nuitka ^
            --standalone ^
            --lto=yes ^
            --mingw64 ^
            --jobs=4 ^
            --python-flag=no_site ^
            --python-flag=no_asserts ^
            --python-flag=no_docstrings ^
            --noinclude-pytest-mode=nofollow ^
            --noinclude-setuptools-mode=nofollow ^
            --noinclude-unittest-mode=nofollow ^
            --assume-yes-for-downloads ^
            --windows-console-mode=attach ^
            --enable-plugin=tk-inter ^
            --company-name="HomeGrid" ^
