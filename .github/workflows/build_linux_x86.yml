# patch-id: linux-i386-installer-ldd-uninstall-2.43
name: Build HomeGrid Backup for Legacy Linux 32-bit (i386)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '**'
      - '!.github/workflows/*.yml'
      - '!.github/workflows/*.yaml'
      - '.github/workflows/build_linux_x86.yml'

permissions:
  contents: write

jobs:
  build-linux-i386-legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check that the container userspace is 32-bit
        run: |
          docker version --format '{{.Server.Version}}'
          docker run --rm --platform linux/386 i386/ubuntu:18.04 sh -c 'echo "$(dpkg --print-architecture) $(getconf LONG_BIT)"' | tee /tmp/arch.txt
          grep -qx "i386 32" /tmp/arch.txt || { echo "ERROR: userspace контейнера не 32-битный"; cat /tmp/arch.txt; exit 1; }
          echo "[OK] Userspace контейнера 32-битный (i386, LONG_BIT=32)"

      - name: Build 32-bit onefile on Ubuntu 18.04 i386 (glibc 2.27)
        run: |
          docker run -i --rm --platform linux/386 \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            i386/ubuntu:18.04 bash -euo pipefail -s <<'CONTAINER_EOF'
          export DEBIAN_FRONTEND=noninteractive
          export PYTHONUTF8=1

          test "$(dpkg --print-architecture)" = "i386" || { echo "ERROR: не i386"; exit 1; }
          test "$(getconf LONG_BIT)" = "32" || { echo "ERROR: LONG_BIT не 32"; exit 1; }

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates gcc-8 g++-8 patchelf pkg-config file \
            libssl-dev libffi-dev libjpeg-dev zlib1g-dev \
            python3.8 python3.8-dev python3.8-venv python3-tk python3-distutils

          command -v gcc-8 >/dev/null || { echo "ERROR: нет gcc-8"; exit 1; }
          test "$(gcc-8 -dumpmachine)" = "i686-linux-gnu" || { echo "ERROR: gcc не i686-linux-gnu"; gcc-8 -dumpmachine; exit 1; }

          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-8 100
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-8 100

          export CC=gcc-8
          export CXX=g++-8
          export LDSHARED="gcc-8 -pthread -shared"
          export LDCXXSHARED="g++-8 -pthread -shared"
          ln -sf /usr/bin/gcc-8 /usr/local/bin/i686-linux-gnu-gcc
          ln -sf /usr/bin/g++-8 /usr/local/bin/i686-linux-gnu-g++

          python3.8 -m venv /opt/venv32
          export PATH="/opt/venv32/bin:/usr/local/bin:$PATH"

          python -c 'import sys, struct, tkinter
          assert sys.version_info[:2] == (3, 8), sys.version
          assert struct.calcsize("P") * 8 == 32, "Python не 32-битный"
          print("Python", sys.version.split(), "32-bit + tkinter OK")'

          python -m pip install --upgrade "pip<24.2" "setuptools<60" wheel
          python -m pip install --no-cache-dir --only-binary=cffi "cffi==1.15.1"
          python -m pip install --no-cache-dir --no-build-isolation "cryptography==3.3.2"
          python -m pip install --no-cache-dir \
            "secretstorage==3.3.1" "jeepney==0.8.0" "keyring==23.13.1" \
            "nuitka==2.5.9" ordered-set \
            "pystray==0.19.5" "python-xlib==0.33" "pillow<10.5" send2trash

          PYSTRAY_BACKEND=dummy python -c 'import tkinter, pystray, keyring, secretstorage, jeepney, PIL, send2trash; print("All 32-bit modules OK")'
          python -c 'import gui.styles; print("Linux GUI styles import OK")'

          export CFLAGS="-O1 -march=i686 -mtune=generic -mno-avx -pipe --param ggc-min-expand=10 --param ggc-min-heapsize=32768"
          export CXXFLAGS="-O1 -march=i686 -mtune=generic -mno-avx -pipe --param ggc-min-expand=10 --param ggc-min-heapsize=32768"
          export LDFLAGS="-Wl,-O1,--as-needed,--no-keep-memory"

          python -m nuitka \
            --onefile \
            --enable-plugin=tk-inter \
            --lto=no \
            --jobs=1 \
            --low-memory \
            --assume-yes-for-downloads \
            --python-flag=no_asserts \
            --python-flag=no_docstrings \
            --noinclude-pytest-mode=nofollow \
            --noinclude-setuptools-mode=nofollow \
            --noinclude-unittest-mode=nofollow \
            --include-package=core \
            --include-package=console \
            --include-package=gui \
            --include-module=pystray \
            --include-module=pystray._xorg \
            --include-package=Xlib \
            --include-package=keyring \
            --include-package=secretstorage \
            --include-package=jeepney \
            --include-package=PIL \
            --include-package-data=keyring \
            --include-package-data=pystray \
            --include-package-data=PIL \
            --include-module=send2trash \
            --include-data-files=icon.ico=icon.ico \
            --nofollow-import-to=gi,mobile,kivy,unittest,pydoc,test,lib2to3,ensurepip,distutils,setuptools,pip,curses,sqlite3,xmlrpc,ftplib,imaplib,poplib,smtplib,telnetlib,turtle,turtledemo,tkinter.test \
            --output-dir=build32 \
            --output-filename=homegrid-backup \
            main.py
          CONTAINER_EOF

      - name: Verify 32-bit binary and create per-user installer
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          sudo chown -R "$USER:$USER" build32
          test -f build32/homegrid-backup || { echo "ERROR: build32/homegrid-backup not created"; exit 1; }
          mkdir -p dist32
          mv build32/homegrid-backup dist32/HomeGridBackup
          chmod +x dist32/HomeGridBackup
          file dist32/HomeGridBackup

          cat << 'INSTALL_EOF' > dist32/install.sh
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          DEST="$HOME/.local/opt/HomeGridBackup"
          BIN_DIR="$HOME/.local/bin"
          LINK_PATH="$BIN_DIR/homegrid-backup"
          DESKTOP_FILE="$HOME/.local/share/applications/homegrid-backup.desktop"

          mkdir -p "$DEST" "$BIN_DIR" "$HOME/.local/share/applications"
          cp "$SCRIPT_DIR/HomeGridBackup" "$DEST/HomeGridBackup"
          cp "$SCRIPT_DIR/rclone" "$DEST/rclone"
          cp "$SCRIPT_DIR/rclone-LICENSE.txt" "$DEST/rclone-LICENSE.txt"
          cp "$SCRIPT_DIR/homegrid-backup.png" "$DEST/homegrid-backup.png"
          chmod +x "$DEST/HomeGridBackup" "$DEST/rclone"
          ln -sf "$DEST/HomeGridBackup" "$LINK_PATH"

          cat > "$DESKTOP_FILE" << EOD
          [Desktop Entry]
          Type=Application
          Name=HomeGrid Backup
          Comment=Inverter Data Backup Utility
          TryExec="$DEST/HomeGridBackup"
          Exec="$DEST/HomeGridBackup" --gui
          Icon="$DEST/homegrid-backup.png"
          Terminal=false
          Categories=Utility;Archiving;
          EOD
          chmod 644 "$DESKTOP_FILE"

          cat > "$DEST/uninstall.sh" << 'EOU'
          #!/usr/bin/env bash
          set -euo pipefail
          EXPECTED_DEST="$HOME/.local/opt/HomeGridBackup"
          if [ -z "${HOME:-}" ] || [ "$EXPECTED_DEST" != "$HOME/.local/opt/HomeGridBackup" ]; then
            echo "ERROR: Небезпечний шлях видалення, операцію скасовано."
            exit 1
          fi
          rm -f "$HOME/.local/bin/homegrid-backup"
          rm -f "$HOME/.local/share/applications/homegrid-backup.desktop"
          if [ -d "$EXPECTED_DEST" ]; then
            rm -rf "$EXPECTED_DEST"
          fi
          echo "HomeGrid Backup видалено."
          echo "Налаштування (~/.backup_hgm) та архіви збережено (за потреби видаліть їх вручну)."
          EOU
          chmod +x "$DEST/uninstall.sh"

          printf 'HomeGrid Backup встановлено в: %s\n' "$DEST"
          printf 'Команда запуску: homegrid-backup (видалення: %s/uninstall.sh)\n' "$DEST"
          case ":$PATH:" in
            *":$BIN_DIR:"*) ;;
            *) printf 'Підказка: відкрийте новий термінал або виконайте: source ~/.profile\n' ;;
          esac

          if command -v ldd >/dev/null 2>&1; then
            MISSING_LIBS="$(ldd "$DEST/HomeGridBackup" 2>/dev/null | grep "not found" | awk '{print $1}' | sort -u || true)"
            if [ -n "$MISSING_LIBS" ]; then
              HOST_ARCH="$(uname -m || true)"
              PKG_SFX=""
              PRE_CMD=""
              if [ "$HOST_ARCH" = "x86_64" ]; then
                PKG_SFX=":i386"
                PRE_CMD="sudo dpkg --add-architecture i386 && "
              fi
              PKGS=""
              for lib in $MISSING_LIBS; do
                case "$lib" in
                  libz.so*) p="zlib1g" ;;
                  libX11.so*) p="libx11-6" ;;
                  libXext.so*) p="libxext6" ;;
                  libXrender.so*) p="libxrender1" ;;
                  libXft.so*) p="libxft2" ;;
                  libfontconfig.so*) p="libfontconfig1" ;;
                  libssl.so*|libcrypto.so*) p="libssl1.1" ;;
                  libffi.so*) p="libffi6" ;;
                  *) p="" ;;
                esac
                if [ -n "$p" ]; then
                  case " $PKGS " in
                    *" ${p}${PKG_SFX} "*) ;;
                    *) PKGS="$PKGS ${p}${PKG_SFX}" ;;
                  esac
                fi
              done
              printf '\n[УВАГА] Відсутні системні бібліотеки:\n%s\n' "$MISSING_LIBS"
              if [ -n "$PKGS" ]; then
                printf 'Для встановлення виконайте:\n  %ssudo apt update && sudo apt install -y%s\n' "$PRE_CMD" "$PKGS"
              fi
            fi
          fi

          DE_UP="$(printf '%s %s' "${XDG_CURRENT_DESKTOP:-}" "${DESKTOP_SESSION:-}" | tr '[:lower:]' '[:upper:]')"
          if [[ "$DE_UP" == *XFCE* ]] && ! command -v xfce4-statusnotifier-plugin >/dev/null 2>&1 && ! dpkg -s xfce4-statusnotifier-plugin >/dev/null 2>&1; then
            printf 'Підказка для трею XFCE: sudo apt install -y xfce4-statusnotifier-plugin (і додайте «Status Notifier» на панель)\n'
          elif [[ "$DE_UP" == *GNOME* ]] && ! dpkg -s gnome-shell-extension-appindicator >/dev/null 2>&1; then
            printf 'Підказка для трею GNOME: sudo apt install -y gnome-shell-extension-appindicator gir1.2-ayatanaappindicator3-0.1\n'
          fi
          INSTALL_EOF
          chmod +x dist32/install.sh
          cp icon.png dist32/homegrid-backup.png
          cp icon.ico dist32/icon.ico

      - name: Bundle verified rclone for legacy Linux i386
        run: |
          asset="rclone-v1.76.0-linux-386.zip"
          curl -fsSL "https://downloads.rclone.org/v1.76.0/$asset" -o "$asset"
          echo "ac5a696aff30c2806475d7c9ae6bbb4eeda47067e5add32448bf33db54552a09  $asset" | sha256sum -c -
          7z x "$asset" -orclone-linux-386 >/dev/null
          rclone_path="$(find rclone-linux-386 -type f -name rclone -print -quit)"
          test -n "$rclone_path"
          cp "$rclone_path" dist32/rclone
          chmod +x dist32/rclone
          curl -fsSL https://raw.githubusercontent.com/rclone/rclone/v1.76.0/COPYING -o dist32/rclone-LICENSE.txt
          bash -n dist32/install.sh

      - name: Package into .7z
        run: |
          cd dist32
          7z a -t7z -mx=9 ../homegrid-backup-linux-i386-legacy.7z HomeGridBackup rclone rclone-LICENSE.txt install.sh homegrid-backup.png icon.ico
          cd ..
          ls -lh homegrid-backup-linux-i386-legacy.7z

      - name: Set build completion timestamp
        id: build_time
        run: echo "value=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Delete previous Linux 32-bit release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete linux-32bit-latest --yes || true
          git push origin --delete linux-32bit-latest || true

      - name: Publish legacy 32-bit .7z to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: linux-32bit-latest
          name: HomeGrid Backup — Linux 32-bit Legacy (i686 / glibc 2.27+) — ${{ steps.build_time.outputs.value }}
          body: |
            Комплект містить 32-бітний виконуваний файл **HomeGridBackup** (ELF i686, Ubuntu 18.04 / glibc 2.27) і rclone 1.76.0.

            - Запустіть `./install.sh` для встановлення поточному користувачу в `~/.local/opt/HomeGridBackup` і створення ярлика меню.
            - Права адміністратора не потрібні; сумісно з MX Linux 32-bit, antiX, Debian 10+ та Ubuntu 18.04+.

          files: homegrid-backup-linux-i386-legacy.7z
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
