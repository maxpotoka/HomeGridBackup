name: Build HomeGrid Backup for Legacy Linux 32-bit (i386)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'main.py'
      - 'core/**'
      - 'console/**'
      - 'gui/**'
      - '.github/workflows/build_linux_x86.yml'

permissions:
  contents: write

jobs:
  build-linux-i386-legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check that the container userspace is 32-bit
        run: |
          docker version --format '{{.Server.Version}}'
          # uname -m показывает архитектуру ядра (x86_64), поэтому проверяем userspace
          docker run --rm --platform linux/386 i386/ubuntu:18.04 sh -c 'echo "$(dpkg --print-architecture) $(getconf LONG_BIT)"' | tee /tmp/arch.txt
          grep -qx "i386 32" /tmp/arch.txt || { echo "ERROR: userspace контейнера не 32-битный"; cat /tmp/arch.txt; exit 1; }
          echo "[OK] Userspace контейнера 32-битный (i386, LONG_BIT=32)"

      - name: Build 32-bit onefile on Ubuntu 18.04 i386 (glibc 2.27)
        run: |
          docker run -i --rm --platform linux/386 \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            i386/ubuntu:18.04 bash -euo pipefail -s <<'CONTAINER_EOF'
          export DEBIAN_FRONTEND=noninteractive
          export PYTHONUTF8=1

          # --- Условие 1: userspace 32-битный ---
          test "$(dpkg --print-architecture)" = "i386" || { echo "ERROR: не i386"; exit 1; }
          test "$(getconf LONG_BIT)" = "32" || { echo "ERROR: LONG_BIT не 32"; exit 1; }

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates gcc-8 g++-8 patchelf pkg-config file \
            libssl-dev libffi-dev libjpeg-dev zlib1g-dev \
            python3.8 python3.8-dev python3.8-venv python3-tk python3-distutils

          # --- Условие 2: компилятор нативный (без кросс-префикса) ---
          command -v gcc-8 >/dev/null || { echo "ERROR: нет gcc-8"; exit 1; }
          test "$(gcc-8 -dumpmachine)" = "i686-linux-gnu" || { echo "ERROR: gcc не i686-linux-gnu"; gcc-8 -dumpmachine; exit 1; }

          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-8 100
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-8 100

          # Линковка идёт через настройки sysconfig Python, поэтому задаём их явно
          export CC=gcc-8
          export CXX=g++-8
          export LDSHARED="gcc-8 -pthread -shared"
          export LDCXXSHARED="g++-8 -pthread -shared"
          # Страховка: если что-то всё же вызовет префиксный компилятор, подставим нативный
          ln -sf /usr/bin/gcc-8 /usr/local/bin/i686-linux-gnu-gcc
          ln -sf /usr/bin/g++-8 /usr/local/bin/i686-linux-gnu-g++

          python3.8 -m venv /opt/venv32
          export PATH="/opt/venv32/bin:/usr/local/bin:$PATH"

          # --- Условие 3: Python 3.8, 32-битный, с tkinter ---
          python -c 'import sys, struct, tkinter
          assert sys.version_info[:2] == (3, 8), sys.version
          assert struct.calcsize("P") * 8 == 32, "Python не 32-битный"
          print("Python", sys.version.split()[0], "32-bit + tkinter OK")'

          python -m pip install --upgrade "pip<24.2" "setuptools<60" wheel
          # cffi берём колесом: сборка из исходников тянула кросс-компилятор
          python -m pip install --no-cache-dir --only-binary=cffi "cffi==1.15.1"
          python -m pip install --no-cache-dir --no-build-isolation "cryptography==3.3.2"
          python -m pip install --no-cache-dir \
            "secretstorage==3.3.1" "jeepney==0.8.0" "keyring==23.13.1" \
            "nuitka==2.5.9" ordered-set \
            "pystray==0.19.5" "python-xlib==0.33"
