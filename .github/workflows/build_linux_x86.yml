name: Build HomeGrid Backup for Legacy Linux 32-bit (i386)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'main.py'
      - 'core/**'
      - 'console/**'
      - 'gui/**'
      - '.github/workflows/build_linux_x86.yml'

permissions:
  contents: write

jobs:
  build-linux-i386-legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build 32-bit onefile on Ubuntu 18.04 i386 (glibc 2.27)
        run: |
          docker run --rm --platform linux/386 \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            i386/ubuntu:18.04 bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates gcc g++ patchelf pkg-config \
                python3 python3-dev python3-venv python3-tk python3-distutils \
                libappindicator3-dev gir1.2-appindicator3-0.1 \
                libgirepository1.0-dev libcairo2-dev \
                gir1.2-secret-1 libsecret-1-0 \
                python3-gi python3-cairo python3-pil python3-keyring python3-secretstorage

              python3 -m venv --system-site-packages /opt/venv32
              /opt/venv32/bin/python -m pip install --upgrade "pip<21.4" "setuptools<58" wheel
              /opt/venv32/bin/python -m pip install --no-cache-dir "nuitka==2.5.9" ordered-set "pystray==0.19.5" send2trash

              /opt/venv32/bin/python -c "import struct; assert struct.calcsize(\"P\")*8 == 32; print(\"32-bit Python OK\")"
              /opt/venv32/bin/python -c "import tkinter, gi; gi.require_version(\"Secret\", \"1\"); gi.require_version(\"AppIndicator3\", \"0.1\"); print(\"Tk + GI OK\")"

              export CFLAGS="-O2 -march=i686 -mtune=generic -mno-avx -pipe"
              export CXXFLAGS="-O2 -march=i686 -mtune=generic -mno-avx -pipe"
              export LDFLAGS="-Wl,-O1,--as-needed"

              DATA_FLAGS=()
              for tl in Secret-1.typelib AppIndicator3-0.1.typelib; do
                FOUND_TL="$(find /usr/lib -name "$tl" 2>/dev/null | head -n 1 || true)"
                if [ -n "$FOUND_TL" ]; then
                  echo "Found typelib: $FOUND_TL"
                  DATA_FLAGS+=("--include-data-files=${FOUND_TL}=girepository-1.0/${tl}")
                fi
              done

              /opt/venv32/bin/python -m nuitka \
                --onefile \
                --enable-plugin=tk-inter \
                --disable-plugin=gi \
                --lto=no \
                --jobs=4 \
                --assume-yes-for-downloads \
                --python-flag=no_asserts \
                --python-flag=no_docstrings \
                --noinclude-pytest-mode=nofollow \
                --noinclude-setuptools-mode=nofollow \
                --noinclude-unittest-mode=nofollow \
                --include-package=core \
                --include-package=console \
                --include-package=gui \
                --include-module=gi._gi \
                --include-module=pystray \
                --include-module=pystray._appindicator \
                --include-module=pystray._xorg \
                --include-package=keyring \
                --include-package=secretstorage \
                --include-package=PIL \
                --include-package-data=keyring \
                --include-package-data=pystray \
                --include-package-data=PIL \
                --include-module=send2trash \
                "${DATA_FLAGS[@]}" \
                --nofollow-import-to=gi.repository,mobile,kivy,unittest,pydoc,test,lib2to3,ensurepip,distutils,setuptools,pip,curses,sqlite3,xmlrpc,ftplib,imaplib,poplib,smtplib,telnetlib,turtle,turtledemo,tkinter.test \
                --output-dir=build32 \
                --output-filename=homegrid-backup \
                main.py
            '

      - name: Verify 32-bit binary and create shortcut helper
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          test -f build32/homegrid-backup || { echo "ERROR: build32/homegrid-backup not created"; exit 1; }
          mkdir -p dist32
          mv build32/homegrid-backup dist32/homegrid-backup
          chmod +x dist32/homegrid-backup
          file dist32/homegrid-backup

          cat << 'EOF' > dist32/install_shortcut.sh
          #!/usr/bin/env bash
          set -e
          APP_DIR="$(cd "$(dirname "$0")" && pwd)"
          BIN_PATH="$APP_DIR/homegrid-backup"
          chmod +x "$BIN_PATH"
          mkdir -p "$HOME/.local/share/applications"
          DESKTOP_FILE="$HOME/.local/share/applications/homegrid-backup.desktop"
          cat > "$DESKTOP_FILE" << EOD
          [Desktop Entry]
          Type=Application
          Name=HomeGrid Backup
          Comment=Inverter Data Backup Utility
          Exec="$BIN_PATH" --gui
          Icon=drive-harddisk
          Terminal=false
          Categories=Utility;Archiving;
          EOD
          chmod +x "$DESKTOP_FILE"
          if [ -d "$HOME/Desktop" ]; then
            cp "$DESKTOP_FILE" "$HOME/Desktop/homegrid-backup.desktop"
            chmod +x "$HOME/Desktop/homegrid-backup.desktop"
          fi
          echo "[OK] Shortcut created: $DESKTOP_FILE"
          EOF
          chmod +x dist32/install_shortcut.sh

      - name: Package into .7z
        run: |
          cd dist32
          7z a -t7z -mx=9 ../homegrid-backup-linux-i386-legacy.7z homegrid-backup install_shortcut.sh
          cd ..
          ls -lh homegrid-backup-linux-i386-legacy.7z

      - name: Publish legacy 32-bit .7z to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-32bit-latest
          name: HomeGrid Backup — Linux 32-bit Legacy (i686 / glibc 2.27+)
          body: |
            Одиничний 32-бітний виконуваний файл **homegrid-backup** (`--onefile`, ELF 32-bit LSB i686, зібраний на Ubuntu 18.04 / glibc 2.27) для старих та легких 32-бітних Linux (Ubuntu 18.04+, Debian 10+, MX Linux, antiX, Puppy Linux, Lubuntu).
            - Запуск: `chmod +x homegrid-backup && ./homegrid-backup`
            - Створити ярлик у меню програм та на робочому столі: `./install_shortcut.sh`
          files: homegrid-backup-linux-i386-legacy.7z
          make_latest: true
